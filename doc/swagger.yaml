info:
  title: Knowledge Hub
  description: The Knowledge Hub API description
  version: '1.0'
  contact: {}
tags:
  - name: Knowledge Hub
    description: ''
servers: []
components:
  schemas:
    CreateUserDto:
      type: object
      properties:
        login:
          type: string
          description: User login
          example: user1
        password:
          type: string
          description: User password
          example: '123456'
        role:
          enum:
            - admin
            - editor
            - viewer
          type: string
          description: User role
          example: admin
      required:
        - login
        - password
    UserResponse:
      type: object
      properties:
        id:
          type: string
          description: User Id (UID)
          example: e30c4ac7-5be6-410a-ac61-c59e3eb5ea4f
        login:
          type: string
        role:
          enum:
            - admin
            - editor
            - viewer
          type: string
        createdAt:
          type: number
        updatedAt:
          type: number
      required:
        - id
        - login
        - role
        - createdAt
        - updatedAt
    UpdateUserDto:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
      required:
        - oldPassword
        - newPassword
    CreateCommentDto:
      type: object
      properties:
        content:
          type: string
          description: Comment content
          example: Great Article
        articleId:
          type: string
          description: articleId
          example: 61ff1183-ef8f-4e21-b9e5-01f7463ad139
        authorId:
          type: string
          nullable: true
          description: authorId
          example: 61ff1183-ef8f-4e21-b9e5-01f7463ad139
      required:
        - content
        - articleId
    Comment:
      type: object
      properties:
        id:
          type: string
          description: User Id (UID)
          example: e30c4ac7-5be6-410a-ac61-c59e3eb5ea4f
        content:
          type: string
        articleId:
          type: string
        authorId:
          type: string
          nullable: true
        createdAt:
          type: number
      required:
        - id
        - content
        - articleId
        - authorId
        - createdAt
    CreateArticleDto:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        status:
          enum: &ref_4
            - draft
            - published
            - archived
          type: string
        authorId:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
      required:
        - title
        - content
    Article:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        status:
          enum:
            - draft
            - published
            - archived
          type: string
        authorId:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: number
        updatedAt:
          type: number
      required:
        - id
        - title
        - content
        - authorId
        - categoryId
        - createdAt
        - updatedAt
    UpdateArticleDto:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        status:
          enum: *ref_4
          type: string
        authorId:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
      required:
        - title
        - content
    CreateCategoryDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name
        - description
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      required:
        - id
        - name
        - description
    UpdateCategoryDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name
        - description
